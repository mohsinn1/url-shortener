<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="background-wrapper">
        <div class="wave-glow wave-1"></div>
        <div class="wave-glow wave-2"></div>
        <div class="wave-glow wave-3"></div>
    </div>
    <div class="content-container">
        <h1>Shorten URL's Instantly</h1>
        <p>Make your messy URL's shorter in just one click.</p>
        <div class="input-group">
            <input type="url" id="url-input" placeholder="Paste your long link here...">
            <button id="shorten-btn">Shorten</button>
        </div>
    </div>
    <div id="result"></div>
    <script src="script.js"></script>
</body>

</html>
